name: Deploy Habit Tracker to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with GitHub Pages base
        env:
          GITHUB_PAGES: "true"
          VITE_FIREBASE_API_KEY: "AIzaSyCX1jKix8QgJBQyAALyisCUmL23zHvBLw"
          VITE_FIREBASE_AUTH_DOMAIN: "data-base-ba8d0.firebaseapp.com"
          VITE_FIREBASE_PROJECT_ID: "data-base-ba8d0"
          VITE_FIREBASE_STORAGE_BUCKET: "data-base-ba8d0.firebasestorage.app"
          VITE_FIREBASE_MESSAGING_SENDER_ID: "930455225534"
          VITE_FIREBASE_APP_ID: "1:930455225534:web:e8a8baabf86e21633fcaef"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
